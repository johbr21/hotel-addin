<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Hotel Factsheet Attacher</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      padding: 16px;
      font-size: 14px;
    }
    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover { background: #005a9e; }
    #result button {
      background: #107c10;
      display: block;
      margin-top: 6px;
      width: 100%;
    }
    #status {
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>Hotel Factsheet Attacher</h3>
  <button id="checkBtn">Check message for hotel</button>
  <div id="result"></div>
  <div id="status"></div>

  <script>
    // ====== YOUR GITHUB REPO DETAILS ======
    const GH_OWNER = "johbr21";
    const GH_REPO = "hotel-addin";
    const GH_FOLDER = ""; // empty = root of the branch
    const GH_BRANCH = "Factsheets";
    // ================================================================

    let hotelFiles = {}; // populated on load: { "hotel name": "raw download url" }

    Office.onReady(() => {
      document.getElementById("checkBtn").onclick = checkForHotel;
      loadHotelList();
    });

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // Pulls the list of PDF filenames from your GitHub repo's factsheets folder.
    // GitHub's API allows cross-origin requests, so this works from GitHub Pages directly.
    async function loadHotelList() {
      setStatus("Loading hotel list...");
      try {
        const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FOLDER}?ref=${GH_BRANCH}`.replace("contents/?", "contents?");
        const response = await fetch(apiUrl, {
          headers: { "Accept": "application/vnd.github+json" }
        });

        if (!response.ok) {
          setStatus("Could not load library (status " + response.status + "). Check GH_OWNER/GH_REPO/GH_FOLDER.");
          return;
        }

        const data = await response.json();
        hotelFiles = {};
        data.forEach(file => {
          if (file.name.toLowerCase().endsWith(".pdf")) {
            const name = file.name.replace(/\.pdf$/i, "").toLowerCase().trim();
            hotelFiles[name] = file.download_url; // raw.githubusercontent.com direct link
          }
        });

        setStatus("Loaded " + Object.keys(hotelFiles).length + " hotel file(s).");
        buildKeywordIndex();
      } catch (err) {
        setStatus("Error loading hotel list: " + err.message);
      }
    }

    // Common filler words to ignore when breaking a filename into matchable keywords.
    const STOPWORDS = new Set([
      "hotel", "hotels", "resort", "resorts", "factsheet", "fact", "sheet",
      "the", "and", "de", "la", "le", "el", "presentation", "final", "v1", "v2",
      "2024", "2025", "2026", "spa", "collection"
    ]);

    // Strips accents (é -> e, ô -> o, etc.) and lowercases, so "Honoré" matches "honore".
    function normalize(str) {
      return str
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    // Breaks a hotel name into meaningful keywords (ignoring stopwords and very short words).
    function getKeywords(name) {
      return normalize(name)
        .split(/[^a-z0-9]+/i)
        .filter(w => w.length >= 3 && !STOPWORDS.has(w));
    }

    // For every keyword, tracks how many different hotels use it.
    // A keyword used by only one hotel is "distinctive" and can match on its own.
    // A keyword shared by several hotels (e.g. a city name) needs a second matching
    // keyword alongside it before we suggest that hotel.
    let keywordHotelCount = {};

    function buildKeywordIndex() {
      keywordHotelCount = {};
      for (const hotelName in hotelFiles) {
        const keywords = new Set(getKeywords(hotelName));
        keywords.forEach(kw => {
          keywordHotelCount[kw] = (keywordHotelCount[kw] || 0) + 1;
        });
      }
    }

    // Reads the current email body text and looks for hotels with a strong-enough keyword match.
    function checkForHotel() {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";
      setStatus("Checking message...");

      Office.context.mailbox.item.body.getAsync("text", (result) => {
        if (result.status !== Office.AsyncResultStatus.Succeeded) {
          setStatus("Could not read the message body.");
          return;
        }

        const bodyText = normalize(result.value);
        let matchCount = 0;

        for (const hotelName in hotelFiles) {
          const keywords = getKeywords(hotelName);
          const matched = keywords.filter(kw => new RegExp("\\b" + kw + "\\b", "i").test(bodyText));
          const distinctiveMatch = matched.some(kw => keywordHotelCount[kw] === 1);

          // Suggest this hotel if at least one matched keyword is unique to it,
          // OR if two or more of its keywords all showed up together.
          if (distinctiveMatch || matched.length >= 2) {
            matchCount++;
            const btn = document.createElement("button");
            btn.textContent = "Attach: " + hotelName + ".pdf";
            btn.title = "Matched on: " + matched.join(", ");
            btn.onclick = () => attachHotelFile(hotelName, hotelFiles[hotelName]);
            resultDiv.appendChild(btn);
          }
        }

        setStatus(matchCount > 0
          ? "Found " + matchCount + " match(es)."
          : "No matching hotel name found in the message.");
      });
    }

    // Fetches the PDF straight from GitHub's raw content CDN and attaches it.
    async function attachHotelFile(hotelName, downloadUrl) {
      setStatus("Fetching " + hotelName + ".pdf...");
      try {
        const response = await fetch(downloadUrl);

        if (!response.ok) {
          setStatus("Could not download the file (status " + response.status + ").");
          return;
        }

        const blob = await response.blob();
        const base64 = await blobToBase64(blob);

        Office.context.mailbox.item.addFileAttachmentFromBase64Async(
          base64,
          hotelName + ".pdf",
          { isInline: false },
          (asyncResult) => {
            if (asyncResult.status === Office.AsyncResultStatus.Succeeded) {
              setStatus("Attached " + hotelName + ".pdf successfully.");
            } else {
              setStatus("Attach failed: " + asyncResult.error.message);
            }
          }
        );
      } catch (err) {
        setStatus("Error attaching file: " + err.message);
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }
  </script>
</body>
</html>
