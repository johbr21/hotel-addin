<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Hotel Factsheet Attacher</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      padding: 16px;
      font-size: 14px;
    }
    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover { background: #005a9e; }
    #result button {
      background: #107c10;
      display: block;
      margin-top: 6px;
      width: 100%;
    }
    #status {
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>Hotel Factsheet Attacher</h3>
  <button id="checkBtn">Check message for hotel</button>
  <div id="result"></div>
  <div id="status"></div>

  <script>
    // ====== YOUR SHAREPOINT DETAILS ======
    const SITE_URL = "https://ihg.sharepoint.com/sites/Globalluxuryandleisuresalesteam";
    const LIBRARY_RELATIVE_PATH = "/sites/Globalluxuryandleisuresalesteam/Shared Documents/EMEAA/Sharing Hub/factsheet";
    // ================================================================

    let hotelFiles = {}; // populated on load: { "hotel name": "server relative url" }

    Office.onReady(() => {
      document.getElementById("checkBtn").onclick = checkForHotel;
      loadHotelList();
    });

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    // Pulls the list of PDF filenames from your SharePoint library via REST API.
    // Uses your existing logged-in session — no separate login needed.
    async function loadHotelList() {
      setStatus("Loading hotel list...");
      try {
        const apiUrl =
          `${SITE_URL}/_api/web/GetFolderByServerRelativeUrl('${encodeURIComponent(LIBRARY_RELATIVE_PATH).replace(/%2F/g, "/")}')/Files` +
          `?$select=Name,ServerRelativeUrl`;

        const response = await fetch(apiUrl, {
          headers: { "Accept": "application/json;odata=verbose" },
          credentials: "include"
        });

        if (!response.ok) {
          setStatus("Could not load library (status " + response.status + "). Check SITE_URL / LIBRARY_RELATIVE_PATH.");
          return;
        }

        const data = await response.json();
        hotelFiles = {};
        data.d.results.forEach(file => {
          if (file.Name.toLowerCase().endsWith(".pdf")) {
            const name = file.Name.replace(/\.pdf$/i, "").toLowerCase().trim();
            hotelFiles[name] = file.ServerRelativeUrl;
          }
        });

        setStatus("Loaded " + Object.keys(hotelFiles).length + " hotel file(s).");
      } catch (err) {
        setStatus("Error loading hotel list: " + err.message);
      }
    }

    // Reads the current email body text and looks for any hotel name match.
    function checkForHotel() {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";
      setStatus("Checking message...");

      Office.context.mailbox.item.body.getAsync("text", (result) => {
        if (result.status !== Office.AsyncResultStatus.Succeeded) {
          setStatus("Could not read the message body.");
          return;
        }

        const bodyText = result.value.toLowerCase();
        let matchCount = 0;

        for (const hotelName in hotelFiles) {
          if (bodyText.includes(hotelName)) {
            matchCount++;
            const btn = document.createElement("button");
            btn.textContent = "Attach: " + hotelName + ".pdf";
            btn.onclick = () => attachHotelFile(hotelName, hotelFiles[hotelName]);
            resultDiv.appendChild(btn);
          }
        }

        setStatus(matchCount > 0
          ? "Found " + matchCount + " match(es)."
          : "No matching hotel name found in the message.");
      });
    }

    // Fetches the PDF from SharePoint and attaches it to the current email as base64.
    async function attachHotelFile(hotelName, serverRelativeUrl) {
      setStatus("Fetching " + hotelName + ".pdf...");
      try {
        const origin = new URL(SITE_URL).origin;
        const fileUrl = origin + serverRelativeUrl;
        const response = await fetch(fileUrl, { credentials: "include" });

        if (!response.ok) {
          setStatus("Could not download the file (status " + response.status + ").");
          return;
        }

        const blob = await response.blob();
        const base64 = await blobToBase64(blob);

        Office.context.mailbox.item.addFileAttachmentFromBase64Async(
          base64,
          hotelName + ".pdf",
          { isInline: false },
          (asyncResult) => {
            if (asyncResult.status === Office.AsyncResultStatus.Succeeded) {
              setStatus("Attached " + hotelName + ".pdf successfully.");
            } else {
              setStatus("Attach failed: " + asyncResult.error.message);
            }
          }
        );
      } catch (err) {
        setStatus("Error attaching file: " + err.message);
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }
  </script>
</body>
</html>
